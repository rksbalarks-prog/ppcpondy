# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which is more than
# this project's build machines have (≈7.5 GB total RAM) — the Gradle daemon
# OOM-crashes with "Native memory allocation (mmap) failed ... G1 virtual space".
# These values build the app comfortably in ~2 GB.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled because this project lives under a
# path containing spaces ("PPC admin and user"). On Windows that combination
# makes the Kotlin daemon fail to release its incremental cache files with
# "Could not close incremental caches in ...caches-jvm/jvm/kotlin", which breaks
# the plugin modules (video_player_android, webview_flutter_android, ...).
# Full compilation is slightly slower but reliable.
kotlin.incremental=false
